<section>
  <div class="overlay"></div>
  <div class="content">
    <h2>Encontrá lo que estás buscando</h2>
    <p>Implantes traumatológicos, bulones y fijaciones de titanio y acero inoxidable para cirugía y ortopedia.</p>
    <app-button
      text="Compartir catálogo"
      icon="share-2"
      type="button"
      (click)="openShare()"
    ></app-button>
  </div>
  <img src="../../../../assets/backgrounds/products-banner.jpg" alt="Banner de productos">
</section>

<app-share-modal
  [isOpen]="shareOpen()"
  [url]="catalogUrl"
  title="Catálogo Bodach — Implantes Traumatológicos"
  (closed)="shareOpen.set(false)"
/>
