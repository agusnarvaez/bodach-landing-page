@if (isLink()) {
  <a
    class="btn"
    [ngClass]="{ 'btn-secondary': isSecondary() }"
    [routerLink]="link"
  >
    @if (icon) {
      <lucide-icon [name]="icon" [size]="20" />
    }
    {{ text }}
  </a>
} @else {
  <button
    class="btn"
    [ngClass]="{ 'btn-secondary': isSecondary() }"
    type="{{ buttonType() }}"
  >
    @if (icon) {
      <lucide-icon [name]="icon" [size]="20" />
    }
    {{ text }}
  </button>
}
