<article class="card">
  <a class="thumb" [routerLink]="['/catalogo', product?.id]" [attr.aria-label]="product?.title">
    <div class="skeleton" [class.hide]="!loading()"></div>
    <img
      [src]="photoUrl()"
      [alt]="product?.title || ''"
      loading="lazy"
      (load)="onLoad()"
    />
  </a>

  <div class="body">
    <h4 class="title">{{ product?.title }}</h4>
    @if (product?.category) {
      <h3 class="category">{{ product?.category }}</h3>
    }
    <ul class="materials">
      @for (material of product?.materials || []; track material; let isLast = $last) {
        <li>{{ material }}@if (!isLast) { | }</li>
      }
    </ul>
    <p class="variants">
      {{ product?.variants_quantity }} variante{{ product?.variants_quantity === 1 ? '' : 's' }}
    </p>
    <div class="row">
      <app-button
        text="Ver detalle"
        icon="arrow-right"
        [link]="'/catalogo/' + product?.id"
      />
    </div>
  </div>
</article>
