<header>
  <img src="../../../assets/logos/logo-bodach.png" alt="Bodach" />

  <button
    class="header-button"
    [class.show]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    aria-controls="main-nav"
    (click)="toggleHeader()"
  >
    <div aria-hidden="true"></div>
  </button>

  <nav
    id="main-nav"
    [class.show]="menuOpen()"
    [attr.aria-hidden]="!menuOpen() ? 'true' : null"
  >
    <ul>
      <li (click)="toggleHeader()">
        <a [routerLink]="['']" [routerLinkActive]="['active']" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      </li>
      <li (click)="toggleHeader()">
        <a [routerLink]="['catalogo']" [routerLinkActive]="['active']">Catálogo</a>
      </li>
      <li (click)="toggleHeader()">
        <a [routerLink]="['contacto']" [routerLinkActive]="['active']">Contacto</a>
      </li>
    </ul>
  </nav>
</header>
